<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gotchi-AI</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.127.0/build/three.min.js"></script>
</head>
<body>
  <main id="game-container">
    <h1>Gotchi-AI</h1>

    <div id="model-container"></div>

    <div id="chat" class="chat-box">Ich sag dir gleich, wie's mir geht...</div>
    <button id="talk" type="button">Wie geht’s dir?</button>

    <section class="api-config">
      <label for="api-key-input">Groq API Key (nur lokal im Browser)</label>
      <div class="api-config-row">
        <input id="api-key-input" type="password" placeholder="gsk_..." autocomplete="off" />
        <button id="save-api-key" type="button">Key speichern</button>
        <button id="clear-api-key" type="button">Key löschen</button>
      </div>
      <small id="api-key-status"></small>
    </section>

    <section id="stats" class="stats">
      <div>
        <label for="hunger-bar">Hunger</label>
        <progress id="hunger-bar" value="100" max="100"></progress>
        <span id="hunger-value">100</span>
      </div>
      <div>
        <label for="mood-bar">Laune</label>
        <progress id="mood-bar" value="100" max="100"></progress>
        <span id="mood-value">100</span>
      </div>
      <div>
        <label for="energy-bar">Energie</label>
        <progress id="energy-bar" value="100" max="100"></progress>
        <span id="energy-value">100</span>
      </div>
    </section>

    <section class="status">
      <p id="age">Alter: 0 Tage, 0 Stunden, 0 Minuten</p>
      <p>Level: <span id="level-num">1</span></p>
      <div class="progress-bar-container">
        <label for="xp-bar">XP</label>
        <progress id="xp-bar" value="0" max="100"></progress>
      </div>
    </section>

    <div id="actions" class="buttons">
      <button id="feed" type="button">Füttern</button>
      <button id="play" type="button">Spielen</button>
      <button id="sleep" type="button">Schlafen</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
